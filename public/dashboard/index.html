<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FMS Tracker Dashboard</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17352b;background:#fff8e7}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}.top{background:#123f35;color:#fff8e7;padding:20px;border-radius:18px}.auth,.row{display:flex;gap:10px;flex-wrap:wrap}.auth{margin-top:12px}input,button{font:inherit;border-radius:10px;padding:10px 12px;border:1px solid #bfd8c3}input{flex:1;min-width:240px}button{cursor:pointer;background:#1f6a4c;color:white;font-weight:800}.secondary{background:#fffdf5;color:#123f35}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}.card{background:#fffdf5;border:1px solid #c9d8cc;border-radius:16px;padding:15px;box-shadow:0 4px 12px #123f3512}.muted{color:#61746c;font-size:13px}.live{margin-top:10px;background:#ddebdD;border-radius:12px;padding:11px}.call-active{background:#ffe1d6;border:1px solid #e88b6d}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ddebdD;font-size:12px;font-weight:800}.logs{margin-top:10px;max-height:320px;overflow:auto;font-size:12px;white-space:pre-wrap;background:#f6eedb;padding:10px;border-radius:10px}.status{font-size:12px;margin-top:8px}.title{font-weight:900;font-size:18px}.danger{color:#a2392a}.hidden{display:none}</style>
</head>
<body><div class="wrap">
<div class="top"><h1>🐼 FMS Tracker</h1><div>Registered devices, remote snapshots and current-call status.</div>
<div class="auth"><input id="token" type="password" placeholder="TRACKER_API_TOKEN (admin only)"/><button id="load">Load devices</button></div></div>
<div id="notice" class="status"></div><div id="devices" class="grid"></div>
</div><script src="/dashboard/dashboard.js"></script></body></html>
